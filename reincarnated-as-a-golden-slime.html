<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reincarnated as a Golden Slime - AnimeGold</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    body{ background:linear-gradient(-45deg,#1a0033,#2d0052,#0a0a2e,#16213e);background-size:400% 400%;animation:gradient 15s ease infinite;font-family:Arial,sans-serif;color:#fff;padding:20px;min-height:100vh }
    @keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    .container{max-width:600px;margin:0 auto;text-align:center}
    h1{font-size:3rem;background:linear-gradient(135deg,#ff9800,#ffb84d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px;animation:glow 2s ease-in-out infinite}
    @keyframes glow{0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 152, 0, 0.5)); } 50% { filter: drop-shadow(0 0 15px rgba(255, 152, 0, 0.8)); }}
    .coming-soon-box{background:rgba(20,20,40,0.9);backdrop-filter:blur(10px);border:3px solid rgba(255,152,0,0.5);padding:50px 30px;border-radius:20px;box-shadow:0 0 50px rgba(255,152,0,0.3)}
    .coming-soon-text{font-size:2.5rem;font-weight:bold;color:#ffb84d;margin:20px 0;text-transform:uppercase;letter-spacing:3px;animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); }}
    .description{font-size:1.2rem;color:#b0b0ff;margin:30px 0;line-height:1.6}
    .emoji{font-size:4rem;margin:20px 0;display:inline-block;animation:float 3s ease-in-out infinite}
    @keyframes float{0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); }}
    button{margin:15px 10px;padding:15px 40px;background:linear-gradient(135deg,#ff9800,#ffb84d);border:none;border-radius:8px;color:#000;font-weight:bold;cursor:pointer;font-size:1rem;transition:all 0.3s ease}
    button:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(255,152,0,0.6)}
    .back-btn{background:linear-gradient(135deg,#6c63ff,#a78bfa);color:#fff}
    .back-btn:hover{box-shadow:0 6px 25px rgba(108,99,255,0.6)}
    .stars{position:absolute;width:100%;height:100%;top:0;left:0;z-index:-1}
    .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0.6}
    
    /* 🎉 BROADCAST ANNOUNCEMENT - TOP BANNER */
    .broadcast-announcement {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #ff9800);
      border-bottom: 3px solid #fff;
      padding: 20px 40px;
      text-align: center;
      z-index: 99999;
      box-shadow: 0 4px 15px rgba(255, 100, 0, 0.8);
      animation: slideDownFromTop 0.4s ease-out;
    }

    @keyframes slideDownFromTop {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .broadcast-announcement h2 {
      color: #000;
      font-size: 24px;
      margin: 0 0 8px 0;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
    }

    .broadcast-announcement p {
      color: #000;
      font-size: 16px;
      font-weight: bold;
      margin: 5px 0;
    }

    .broadcast-username {
      color: #d63031;
      font-size: 18px;
      font-weight: bold;
    }

    .broadcast-amount {
      color: #00b894;
      font-size: 20px;
      font-weight: bold;
      margin: 5px 0;
    }

    .broadcast-emojis {
      font-size: 28px;
      animation: emojiFloat 2s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes emojiFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 99997;
    }
  </style>
</head>
<body>
  <div class="stars" id="starsContainer"></div>
  
  <div class="container">
    <h1>Reincarnated as a Golden Slime</h1>
    <div class="coming-soon-box">
      <div class="emoji">✨🟡</div>
      <div class="coming-soon-text">Coming Soon</div>
      <p class="description">
        Prepare for a unique adventure! Experience the extraordinary tale of rebirth and transformation. 
        The Reincarnated as a Golden Slime series is coming to AnimeGold with exciting episodes ahead!
      </p>
      <p style="color:#ff9800;font-size:1.1rem;font-weight:bold;margin:20px 0">
        ⏰ Release date will be announced soon!
      </p>
      <button class="back-btn" onclick="window.location.href='earn.html'">← Back to Series</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:aca8f68412e95ef369cba4",
      measurementId: "G-J9LX9WMPJK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 🎉 BROADCAST ANNOUNCEMENT FUNCTIONS
    function showBroadcastAnnouncement(userName, amount) {
      // Create announcement banner at top
      const announcement = document.createElement('div');
      announcement.className = 'broadcast-announcement';
      announcement.innerHTML = `
        <div class="broadcast-emojis">🎉🔥💰</div>
        <h2>CONGRATULATIONS!</h2>
        <p>
          <span class="broadcast-username">${userName}</span>
        </p>
        <p>Just claimed <span class="broadcast-amount">₱${amount}</span></p>
        <p>🏆 Amazing! 🏆</p>
      `;

      document.body.appendChild(announcement);

      // Generate confetti
      createConfetti();

      // Remove after 5 seconds
      setTimeout(() => {
        announcement.style.animation = 'slideDownFromTop 0.4s ease-out reverse';
        setTimeout(() => {
          announcement.remove();
        }, 400);
      }, 5000);
    }

    function createConfetti() {
      const confettiPieces = ['🎉', '🔥', '💰', '🏆', '⭐', '✨', '🎊'];
      for (let i = 0; i < 30; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.textContent = confettiPieces[Math.floor(Math.random() * confettiPieces.length)];
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.top = Math.random() * 100 + '%';
        confetti.style.fontSize = (Math.random() * 20 + 15) + 'px';
        confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
      }
    }

    // Add confetti animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fall {
        to {
          transform: translateY(100vh) rotate(360deg);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);

    // Listen for real-time claim announcements
    function listenForAnnouncements() {
      try {
        const announcementsRef = collection(db, "claims");
        const q = query(announcementsRef);
        
        let isFirst = true;
        onSnapshot(q, (snapshot) => {
          snapshot.docChanges().forEach((change) => {
            if (change.type === "added" && !isFirst) {
              const data = change.doc.data();
              showBroadcastAnnouncement(data.userName, data.amount);
            }
          });
          if (isFirst) isFirst = false;
        });
      } catch (error) {
        console.log("Announcements collection not ready yet");
      }
    }

    listenForAnnouncements();

    // Generate random stars in background
    const starsContainer = document.getElementById('starsContainer');
    for(let i = 0; i < 50; i++){
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.opacity = Math.random() * 0.6 + 0.2;
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
