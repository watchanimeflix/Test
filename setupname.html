<!DOCTYPE html>
<html>
<head>
  <title>Setup Name - AnimeGold</title>
  <style>
    body { background:#111; color:#fff; text-align:center; font-family:Arial; }
    .section { margin:20px; padding:20px; border-radius:10px; background:#222; }
    input { margin:10px; padding:8px; border-radius:5px; }
    button { margin:10px; padding:10px 20px; background:#ff9800; border:none; border-radius:5px; cursor:pointer; display:none; }
    
    /* 🎉 BROADCAST ANNOUNCEMENT - TOP BANNER */
    .broadcast-announcement {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #ff9800);
      border-bottom: 3px solid #fff;
      padding: 20px 40px;
      text-align: center;
      z-index: 99999;
      box-shadow: 0 4px 15px rgba(255, 100, 0, 0.8);
      animation: slideDownFromTop 0.4s ease-out;
    }

    @keyframes slideDownFromTop {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .broadcast-announcement h2 {
      color: #000;
      font-size: 24px;
      margin: 0 0 8px 0;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
    }

    .broadcast-announcement p {
      color: #000;
      font-size: 16px;
      font-weight: bold;
      margin: 5px 0;
    }

    .broadcast-username {
      color: #d63031;
      font-size: 18px;
      font-weight: bold;
    }

    .broadcast-amount {
      color: #00b894;
      font-size: 20px;
      font-weight: bold;
      margin: 5px 0;
    }

    .broadcast-emojis {
      font-size: 28px;
      animation: emojiFloat 2s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes emojiFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 99997;
    }
  </style>
</head>
<body>
  <div class="section">
    <h2>Set Your AnimeGold Name</h2>
    <input id="userName" placeholder="Enter your name"><br>
    <button id="confirmBtn">Confirm</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6qQybRVw4nlwGA-Kp8d6kCqOhdqo11Aw",
      authDomain: "animegold-bf2a7.firebaseapp.com",
      projectId: "animegold-bf2a7",
      storageBucket: "animegold-bf2a7.firebasestorage.app",
      messagingSenderId: "1055086176557",
      appId: "1:1055086176557:web:aca8f68412e95ef369cba4",
      measurementId: "G-J9LX9WMPJK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userRef;

    // 🎉 BROADCAST ANNOUNCEMENT FUNCTIONS
    function showBroadcastAnnouncement(userName, amount) {
      // Create announcement banner at top
      const announcement = document.createElement('div');
      announcement.className = 'broadcast-announcement';
      announcement.innerHTML = `
        <div class="broadcast-emojis">🎉🔥💰</div>
        <h2>CONGRATULATIONS!</h2>
        <p>
          <span class="broadcast-username">${userName}</span>
        </p>
        <p>Just claimed <span class="broadcast-amount">₱${amount}</span></p>
        <p>🏆 Amazing! 🏆</p>
      `;

      document.body.appendChild(announcement);

      // Generate confetti
      createConfetti();

      // Remove after 5 seconds
      setTimeout(() => {
        announcement.style.animation = 'slideDownFromTop 0.4s ease-out reverse';
        setTimeout(() => {
          announcement.remove();
        }, 400);
      }, 5000);
    }

    function createConfetti() {
      const confettiPieces = ['🎉', '🔥', '💰', '🏆', '⭐', '✨', '🎊'];
      for (let i = 0; i < 30; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.textContent = confettiPieces[Math.floor(Math.random() * confettiPieces.length)];
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.top = Math.random() * 100 + '%';
        confetti.style.fontSize = (Math.random() * 20 + 15) + 'px';
        confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
      }
    }

    // Add confetti animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fall {
        to {
          transform: translateY(100vh) rotate(360deg);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);

    // Listen for real-time claim announcements
    function listenForAnnouncements() {
      try {
        const announcementsRef = collection(db, "claims");
        const q = query(announcementsRef);
        
        let isFirst = true;
        onSnapshot(q, (snapshot) => {
          snapshot.docChanges().forEach((change) => {
            if (change.type === "added" && !isFirst) {
              const data = change.doc.data();
              showBroadcastAnnouncement(data.userName, data.amount);
            }
          });
          if (isFirst) isFirst = false;
        });
      } catch (error) {
        console.log("Announcements collection not ready yet");
      }
    }

    onAuthStateChanged(auth, async (u) => {
      if (u) {
        // Listen for announcements
        listenForAnnouncements();

        userRef = doc(db, "users", u.uid);
        const snap = await getDoc(userRef);

        if (snap.exists() && snap.data().userName) {
          // ✅ Name already set → skip setup
          window.location.href = "earn.html";
        } else {
          // ❌ No name yet → show input + button
          document.getElementById("confirmBtn").style.display = "inline-block";
          document.getElementById("confirmBtn").onclick = async () => {
            const name = document.getElementById("userName").value.trim();
            if (!name) {
              alert("Please enter a name!");
              return;
            }
            try {
              // ✅ Save both name + Gmail email
              await setDoc(userRef, { 
                userName: name,
                email: u.email,                // auto‑save Gmail
                createdAt: new Date().toISOString()
              }, { merge: true });

              alert("Name and email saved!");
              window.location.href = "earn.html";
            } catch (e) {
              alert("Error: " + e.message);
            }
          };
        }
      } else {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
